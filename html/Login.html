<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/Login.css">
</head>

<body>

    <header class="top-nav">
        <div class="brand">
            <div class="brand-logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" aria-hidden="true">
                    <circle cx="72" cy="72" r="48" stroke="#A5B4FC" stroke-width="5" />
                    <path d="M106 106L132 132" stroke="#C4B5FD" stroke-width="10" stroke-linecap="round" />
                    <path d="M72 43C54 43 45 57 45 75S57 108 72 108 99 94 99 75 90 43 72 43Z" stroke="#F4F6FF"
                        stroke-width="4" />
                    <circle cx="62" cy="70" r="3.5" fill="#F4F6FF" />
                    <circle cx="82" cy="70" r="3.5" fill="#F4F6FF" />
                    <path d="M64 85Q72 92 80 85" stroke="#F4F6FF" stroke-width="3" stroke-linecap="round" />
                </svg>
            </div>
            <span class="brand-name">CampusLens</span>
        </div>
        <a href="Landing.html" class="back-link">Back Home</a>
    </header>

    <div class="login-card">
        <div class="badge">
            <svg class="badge-icon" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                <path d="m9 12 2 2 4-4" />
            </svg>
            Secure Your Identity
        </div>

        <h1 class="title">Welcome back</h1>
        <p class="subtitle">Sign in to access your records.</p>

        <div class="role-switcher">
            <button type="button" class="role-btn active" id="studentBtn">Student</button>
            <button type="button" class="role-btn" id="facultyBtn">Admin</button>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username" id="emailLabel">Student Email</label>
                <div class="input-wrapper" id="usernameWrapper">
                    <svg class="input-icon-left" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="16" rx="2" />
                        <circle cx="9" cy="10" r="2" />
                        <path d="M15 8h2M15 12h2M7 16h10" />
                    </svg>
                    <input type="text" id="username" class="form-input" placeholder="student@university.edu">
                </div>
                <span class="error-msg" id="usernameError"></span>
            </div>


            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper" id="passwordWrapper">
                    <svg class="input-icon-left" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" id="password" class="form-input" placeholder="••••••••••••">
                    <button type="button" class="input-icon-right" id="togglePassword"
                        aria-label="Toggle password visibility">
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9.60997 9.60714C8.05503 10.4549 7 12.1043 7 14C7 16.7614 9.23858 19 12 19C13.8966 19 15.5466 17.944 16.3941 16.3878M21 14C21 9.02944 16.9706 5 12 5C11.5582 5 11.1238 5.03184 10.699 5.09334M3 14C3 11.0069 4.46104 8.35513 6.70883 6.71886M3 3L21 21"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg class="icon-eye-open" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M3 14C3 9.02944 7.02944 5 12 5C16.9706 5 21 9.02944 21 14M17 14C17 16.7614 14.7614 19 12 19C9.23858 19 7 16.7614 7 14C7 11.2386 9.23858 9 12 9C14.7614 9 17 11.2386 17 14Z"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
                <span class="error-msg" id="passwordError"></span>
            </div>

            <button type="submit" class="submit-btn">
                Sign In
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <hr class="divider">

        <p class="signup-text">
            Don't have an account? <a href="Signup.html" class="signup-link">Create One.</a>
        </p>
    </div>

    <script src="../js/Login.js"></script>
</body>

</html>
